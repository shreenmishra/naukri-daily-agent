name: Naukri Profile Daily Refresh & Auto-Applier Agent

on:
  schedule:
    # 9:00 AM IST is 03:30 UTC
    # 1:00 PM IST is 07:30 UTC
    - cron: '30 3,7 * * *'
  # Allows manual triggers from GitHub Actions UI anytime
  workflow_dispatch:
    inputs:
      apply_jobs:
        description: 'Search and auto-apply to matching jobs?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_apply:
        description: 'Max jobs to apply per run'
        required: false
        default: '5'
        type: string

jobs:
  refresh-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore Session State (Optional / OTP Bypass)
        if: "${{ env.NAUKRI_AUTH_STATE_B64 != '' }}"
        env:
          NAUKRI_AUTH_STATE_B64: ${{ secrets.NAUKRI_AUTH_STATE_B64 }}
        run: |
          echo "$NAUKRI_AUTH_STATE_B64" | base64 -d > naukri_state.json

      - name: Execute Naukri Profile Update & Auto-Applier Agent
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: |
          APPLY_FLAG="--apply-jobs --max-apply ${{ github.event.inputs.max_apply || '5' }}"
          if [ "${{ github.event.inputs.apply_jobs }}" == "false" ]; then
            APPLY_FLAG=""
          fi
          python naukri_agent.py --mode headline $APPLY_FLAG

      - name: Display Job Application Summary in GitHub Step Summary
        if: always()
        run: |
          if [ -f applied_jobs_summary.md ]; then
            cat applied_jobs_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Verification Screenshots, Logs & Applied Jobs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-agent-report
          path: |
            *.png
            naukri_updater.log
            applied_jobs_summary.csv
            applied_jobs_summary.md
          retention-days: 14
